{{define "content"}}
<div class="topbar">
    <div>
        <div class="h-title">Ajouter une carte</div>
        <div class="h-sub">Saisis un ID Pokémon — aperçu en temps réel (PokeAPI)</div>
    </div>
</div>

{{if .NoticeError}}
<div class="notice error" style="margin-bottom:12px;">{{.NoticeError}}</div>
{{end}}

<div class="panel">
    <div class="panel-inner">
        <form method="POST" action="/card/add" class="row" data-add-card-form>
            <div>
                <label class="stat-label" style="display:block; margin-bottom:8px;">ID Pokémon</label>
                <input class="app-input" type="number" name="pokemon_id" min="1" max="1025" placeholder="ex: 25"
                    required data-add-card-id>
                <div class="h-sub" style="margin-top:8px;">L’aperçu utilise PokeAPI côté navigateur.</div>
            </div>
            <div>
                <button type="submit" class="btn-app">Ajouter à ma collection</button>
            </div>
        </form>

        <div style="margin-top:14px;">
            <div class="chart-title">Aperçu</div>
            <div class="cards-grid" style="grid-template-columns: 1fr; max-width: 320px;" data-preview-slot>
                <div class="poke-card" data-preview-card>
                    <div class="poke-img"><img src="" alt="" data-preview-img style="opacity:0;"></div>
                    <div class="poke-name" data-preview-name>—</div>
                    <div class="types" data-preview-types>Entre un ID pour charger l’aperçu</div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
